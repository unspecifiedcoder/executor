specVersion: 0.0.7
description: Indexes Executor's Receiver events on Sepolia (Estate events too, if Arc is indexable at demo time)
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Receiver
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000" # filled in post-deploy
      abi: Receiver
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Heartbeat
        - AdministrationEvent
        - LiquidationEvent
        - Succession
      abis:
        - name: Receiver
          file: ../../contracts/out/Receiver.sol/Receiver.json
      eventHandlers:
        - event: Heartbeat(uint64)
          handler: handleHeartbeat
        - event: AdministrationDeclared(uint64)
          handler: handleAdministrationDeclared
        - event: LiquidationDeclared(bytes32,uint64)
          handler: handleLiquidationDeclared
        - event: SuccessorAssigned(address,address)
          handler: handleSuccessorAssigned
      file: ./src/receiver.ts
